# TP Seance 18 - Integration continue (CI) avec GitHub Actions
#
# Projet Adult Income : qualite (ruff, mypy, pytest) puis entrainement baseline.
# Package mlproject dans src/mlproject, donnees dans data/.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualite (lint + types + tests)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Installation de uv (avec cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installation des dependances (projet + dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/mlproject

      - name: Types (mypy)
        run: uv run mypy src/mlproject

      - name: Tests (pytest)
        run: uv run pytest

  train:
    name: Entrainement (Continuous Training)
    runs-on: ubuntu-latest
    needs: quality

    env:
      PYTHONPATH: src
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Installation de uv (avec cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installation des dependances
        run: uv sync

      - name: Donnees + entrainement de la baseline
        run: |
          uv run python src/scripts/prepare_data.py
          uv run python -m mlproject.train

      - name: Publication du modele en artefact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib
